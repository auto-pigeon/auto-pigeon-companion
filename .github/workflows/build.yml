# Verification build: every push and pull request compiles all six targets and
# runs the tests.
#
# No Docker and no CGO toolchain, because there is nothing to link against — the
# binary is pure Go with an embedded frontend, so one ubuntu runner
# cross-compiles every target with plain `go build`. The Windows and macOS
# runners exist only to run the tests natively, where the platform-specific
# paths (%AppData%, ~/Library, the .exe suffix) are actually exercised.
#
# # This workflow publishes NOTHING and holds no credential
#
# No release, no durable upload, no signing, and it reads no `secrets` anywhere —
# `grep -c secrets` on this file is zero and the `no-credentials` job below keeps
# it that way. A workflow that could publish from a pull request would be a
# workflow that publishes whatever a pull request contains.
# Publishing is release.yml's, on one job, for pushes to main — see README.md.
#
# # The extractor is not built here, and is not IN here
#
# Auto-Pigeon Extractor is a separate program under its own licence
# (proprietary, LicenseRef-Auto-Pigeon-Proprietary, since NEW_247G).
# It used to be staged into `internal/aue/embedded/` and compiled into this
# binary. A release now ships it as its own file BESIDE the Companion
# (build/bundle-sidecar.sh), and nothing ever downloads it. Nothing in this
# workflow embeds it, and the `no-embedded-extractor` job fails if that ever
# comes back.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.8"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # gofmt -l prints unformatted files and exits 0, so the output has to be
      # turned into the failure itself.
      - name: check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "these files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [test, gofmt]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Explicit, not incidental: CGO is what would make any of these six
          # targets need a cross toolchain. If a change ever requires it, this
          # job fails, which is the point.
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o "dist/${GOOS}-${GOARCH}/companion${{ matrix.ext }}" \
            ./cmd/companion

      - name: macOS app bundle
        if: matrix.goos == 'darwin'
        run: |
          ./build/macos/make-app-bundle.sh \
            --binary "dist/darwin-${{ matrix.goarch }}/companion" \
            --arch "${{ matrix.goarch }}" \
            --version "${GITHUB_SHA::7}" \
            --out "dist/darwin-${{ matrix.goarch }}"

      - name: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auto-pigeon-companion-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}-${{ matrix.goarch }}/
          if-no-files-found: error

      # TODO: the Windows installer (iscc on a windows-latest runner with
      # build/windows/installer.iss) and the Linux .deb/.rpm (nfpm with
      # build/linux/nfpm.yaml) are skeletons in this repository and are not
      # wired into CI yet — they belong in a release workflow, not this
      # per-push verification one.
      #
      # TODO: code signing and notarization of the COMPANION's own artifacts.
      # No certificates exist; see build/macos/make-app-bundle.sh and README.md.
      # Whenever they do, they belong in a release workflow that a tag triggers —
      # never in this one, which runs on every pull request.

  no-embedded-extractor:
    name: the extractor is not embedded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Three ways the embed could come back, each checked by name rather than
      # by reading a diff. It was removed for a licensing reason as much as a
      # technical one — an MIT artifact must not contain a program under another
      # licence (the extractor: AGPL-3.0 then, proprietary now) — so a
      # reviewer who does not know that history still gets a failure that
      # explains it.
      - name: no staged extractor binary
        run: |
          if [ -e internal/aue/embedded ]; then
            echo "internal/aue/embedded exists. The extractor is a separate proprietary" >&2
            echo "program shipped beside the Companion in a release; embedding it" >&2
            echo "puts its bytes inside this repository's MIT artifact. See internal/aue." >&2
            exit 1
          fi
      # The DIRECTIVE, at the start of a line — not the two places the package
      # comment mentions it while explaining why it is gone.
      - name: no go:embed directive in internal/aue
        run: |
          if grep -rnE '^[[:space:]]*//go:embed' internal/aue; then
            echo "internal/aue embeds something. See the job above." >&2
            exit 1
          fi
      - name: no committed executable anywhere
        run: |
          # An ELF, Mach-O or PE header in a tracked file. The frontend assets
          # are text and the fixtures are JSON, so anything matching is either a
          # mistake or a binary somebody meant to ship.
          found=0
          while IFS= read -r file; do
            case "$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')" in
              7f454c46|cffaedfe|cefaedfe|4d5a*) echo "executable committed: $file" >&2; found=1 ;;
            esac
          done < <(git ls-files)
          exit "$found"

  release-contract:
    name: the release bundle composes
    needs: [test, gofmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # The bundling path, exercised both ways and publishing nothing: without
      # an extractor the bundle says none is inside; with one it sits beside the
      # Companion as its own file, listed with its digest — which the Companion
      # then checks before running it. The "extractor" here is a stand-in
      # linux/amd64 executable (a second Companion build: the bundle step reads
      # the header, so it has to be a real one for the right platform); nothing
      # is downloaded. release.yml builds the real one from build/aue-pin.json.
      - name: assemble a bundle without and with an extractor
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/companion" ./cmd/companion
          build/bundle-sidecar.sh --platform linux-amd64 --version 0.0.0-ci \
            --binary-dir "$RUNNER_TEMP/bin" --out "$RUNNER_TEMP/without"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["extractor"] is None and "extractor_absent" in m' \
            "$RUNNER_TEMP/without/auto-pigeon-companion-0.0.0-ci-linux-amd64/bundle-manifest.json"
          cp "$RUNNER_TEMP/bin/companion" "$RUNNER_TEMP/aue"
          printf 'stand-in licence\n' > "$RUNNER_TEMP/aue-license"
          build/bundle-sidecar.sh --platform linux-amd64 --version 0.0.0-ci \
            --binary-dir "$RUNNER_TEMP/bin" --out "$RUNNER_TEMP/with" \
            --extractor "$RUNNER_TEMP/aue" --extractor-version 0.0.0-ci \
            --extractor-commit "$GITHUB_SHA" --extractor-license "$RUNNER_TEMP/aue-license" \
            --extractor-source "https://example.invalid/aue/tree/$GITHUB_SHA"
          test -x "$RUNNER_TEMP/with/auto-pigeon-companion-0.0.0-ci-linux-amd64/auto-pigeon-extractor"
          test -f "$RUNNER_TEMP/with/auto-pigeon-companion-0.0.0-ci-linux-amd64/LICENSE-auto-pigeon-extractor.txt"
      # The release's decisions, driven the way release.yml drives them.
      - name: the release plan reads its pin
        run: python3 build/release-plan.py pin

  security-contract:
    name: the threat model states itself
    needs: [test, gofmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # `go test ./...` above already fails when a matrix row names a test that
      # is not in the tree, or when a residual risk's review date has passed.
      # What this job adds is the other half: that the BUILT program can state
      # the model, and that the two claims a release rests on are true of the
      # binary rather than of a test binary.
      - name: the shipped program states its own threat model
        run: |
          go build -o "$RUNNER_TEMP/companion" ./cmd/companion
          "$RUNNER_TEMP/companion" security matrix --json > "$RUNNER_TEMP/matrix.json"
          python3 - "$RUNNER_TEMP/matrix.json" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          missing = [r["id"] for r in rows if not r.get("evidence") and not r.get("manual")]
          assert rows, "the matrix is empty"
          assert not missing, f"rows with no evidence: {missing}"
          print(f"{len(rows)} rows, every one with evidence")
          PY

      # Zero external modules, read out of the binary rather than out of go.mod.
      # A binary that quietly contained somebody else's code would be one whose
      # licence statement is wrong. The copyleft check below stays a copyleft
      # check: the proprietary extractor offers no source and needs none, and
      # it must never be listed as MIT.
      - name: nothing outside the standard library is linked in
        run: |
          "$RUNNER_TEMP/companion" security audit --json > "$RUNNER_TEMP/audit.json"
          python3 - "$RUNNER_TEMP/audit.json" <<'PY'
          import json, sys
          audit = json.load(open(sys.argv[1]))
          count = audit["go_module_dep_count"]
          assert count == 0, f"{count} external module(s): {audit['go_module_deps']}"
          shipped = [c for c in audit["components"] if c["distribution"] == "shipped-beside-in-the-release"]
          assert shipped, "no component is shipped beside the Companion; the extractor is missing from the audit"
          missing = [c["name"] for c in shipped
                     if c["spdx"].startswith(("GPL", "AGPL", "LGPL"))
                     and not c.get("corresponding_source")]
          assert not missing, f"copyleft components shipped beside the Companion offering no source: {missing}"
          mit = [c["name"] for c in shipped if c["spdx"].upper().startswith("MIT")]
          assert not mit, f"components shipped beside the Companion listed as MIT: {mit}"
          print("no external modules; every copyleft component shipped beside it offers its source")
          PY

      # The SBOM has to be the same bytes twice, or it cannot be published
      # beside a digest of itself.
      - name: two SBOMs of one build are identical
        run: |
          "$RUNNER_TEMP/companion" release sbom > "$RUNNER_TEMP/a.json"
          "$RUNNER_TEMP/companion" release sbom > "$RUNNER_TEMP/b.json"
          cmp "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json"

  no-credentials:
    name: this workflow holds no credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A publishing step is a deliberate act with a key that is not here. This
      # fails the moment somebody adds one to THIS workflow, which is the one
      # that runs on every pull request.
      # The pattern is written so it does not match ITSELF: a check that fails on
      # its own source is a check nobody can keep.
      - name: no secrets are read
        run: |
          if grep -nE '[$][{][{][[:space:]]*secrets' .github/workflows/build.yml; then
            echo "this workflow reads a secret. Publishing and signing belong in a" >&2
            echo "release workflow a tag triggers, never in one a pull request runs." >&2
            exit 1
          fi
